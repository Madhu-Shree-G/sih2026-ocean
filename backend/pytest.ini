[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*
    ignore:.*ListedColormap.*:DeprecationWarning
    ignore:.*Consolidated metadata.*
    ignore:.*httpx.*:DeprecationWarning
